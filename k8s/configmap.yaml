apiVersion: v1
kind: ConfigMap
metadata:
  name: vod-api-config
  namespace: vod
data:
  STORAGE_BACKEND: "s3"
  S3_BUCKET: "REPLACE_WITH_BUCKET_NAME"          # terraform output bucket_name
  S3_PREFIX: "videos"
  AWS_REGION: "ap-south-1"
  CLOUDFRONT_DOMAIN: "REPLACE_WITH_CLOUDFRONT_DOMAIN"  # terraform output cloudfront_domain
  MAX_UPLOAD_MB: "200"
  DATA_DIR: "/data"
  DB_PATH: "/data/videos.db"
