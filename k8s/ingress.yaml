# Needs the AWS Load Balancer Controller installed in the cluster.
# It creates an Application Load Balancer (ALB) in front of the service.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: vod-api
  namespace: vod
  annotations:
    alb.ingress.kubernetes.io/scheme: internet-facing
    alb.ingress.kubernetes.io/target-type: ip
    alb.ingress.kubernetes.io/healthcheck-path: /health
spec:
  ingressClassName: alb
  rules:
    - http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: vod-api
                port:
                  name: http
