# On EKS, attach an IAM role (IRSA) that carries the policy created by Terraform
# (output: app_iam_policy_arn) so the pod can write to S3 without static keys.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: vod-api
  namespace: vod
  annotations:
    eks.amazonaws.com/role-arn: "arn:aws:iam::REPLACE_ACCOUNT_ID:role/REPLACE_ROLE_NAME"
