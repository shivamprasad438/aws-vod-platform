name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install FFmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Install dependencies
        run: pip install -r requirements-dev.txt
      - name: Lint
        run: ruff check app tests
      - name: Test
        run: pytest -q

  docker:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t vod-api:${{ github.sha }} .
      - name: Smoke test the container
        run: |
          docker run -d --name vod -p 8000:8000 vod-api:${{ github.sha }}
          for i in $(seq 1 20); do
            curl -fsS http://localhost:8000/health && exit 0
            sleep 2
          done
          docker logs vod
          exit 1

  terraform:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: terraform
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
      - name: Check formatting (run "terraform fmt" locally if this warns)
        run: terraform fmt -check -recursive
        continue-on-error: true
      - run: terraform init -backend=false
      - run: terraform validate

  # Pushes the image to ECR from main. Needs the repository variables AWS_ROLE_ARN
  # (an IAM role trusted for GitHub OIDC) and AWS_REGION. Skipped until you set them.
  push-to-ecr:
    runs-on: ubuntu-latest
    needs: [docker, terraform]
    if: github.ref == 'refs/heads/main' && vars.AWS_ROLE_ARN != ''
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
      - id: ecr
        uses: aws-actions/amazon-ecr-login@v2
      - name: Build and push
        env:
          REGISTRY: ${{ steps.ecr.outputs.registry }}
        run: |
          docker build -t "$REGISTRY/vod-api:${{ github.sha }}" -t "$REGISTRY/vod-api:latest" .
          docker push "$REGISTRY/vod-api:${{ github.sha }}"
          docker push "$REGISTRY/vod-api:latest"
